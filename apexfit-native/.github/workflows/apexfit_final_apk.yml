name: ApexFit FINAL APK BUILD

on:
  push:
    branches: [ feature/native-android-migration ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Native Android
        run: |
          # Use the existing gradle wrapper if available, otherwise use installed gradle
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
            ./android/gradlew assembleDebug
          else
            gradle assembleDebug -p android
          fi

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: APEXFIT_FINAL_APK
          path: android/app/build/outputs/apk/debug/*.apk
