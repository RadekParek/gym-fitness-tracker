name: Final APK Build

on:
  push:
    branches: [ feature/native-android-migration ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          gradle assembleDebug -p android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexFit-Native-APK
          path: android/app/build/outputs/apk/debug/*.apk
